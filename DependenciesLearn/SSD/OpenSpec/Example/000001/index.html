<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办事项应用</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>待办事项</h1>
            <button id="theme-toggle" class="theme-btn">🌙</button>
        </header>
        
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="添加新的待办事项...">
            <select id="priority-select" class="priority-select">
                <option value="high">🔴 高</option>
                <option value="medium" selected>🟡 中</option>
                <option value="low">🟢 低</option>
            </select>
            <button id="add-btn">添加</button>
        </div>
        
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="pending">未完成</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
        </div>
        
        <div class="priority-filter">
            <button class="priority-btn active" data-priority="all">全部优先级</button>
            <button class="priority-btn" data-priority="high">🔴 高</button>
            <button class="priority-btn" data-priority="medium">🟡 中</button>
            <button class="priority-btn" data-priority="low">🟢 低</button>
        </div>
        
        <ul id="todo-list" class="todo-list"></ul>
        
        <div class="stats">
            <span id="pending-count">0</span> 个未完成事项
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
