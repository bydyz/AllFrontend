<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案1：CSS变量 + 媒体查询</title>
  <style>
    /* ============================================
       CSS 变量定义 - 默认亮色主题
       ============================================ */
    :root {
      --bg: #ffffff;        /* 页面背景色 */
      --text: #333333;      /* 文本颜色 */
      --card-bg: #f5f5f5;   /* 卡片背景色 */
    }

    /* ============================================
       媒体查询 - 检测系统暗色模式偏好
       ============================================
       prefers-color-scheme 是 CSS 媒体查询特性
       用于检测用户操作系统的主题偏好
       ============================================ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;      /* 暗色主题背景 */
        --text: #e0e0e0;    /* 暗色主题文本 */
        --card-bg: #2d2d2d; /* 暗色主题卡片 */
      }
    }

    body {
      margin: 0;
      padding: 20px;
      /* 使用 CSS 变量，轻松实现主题切换 */
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      /* 添加过渡动画，提升用户体验 */
      transition: background-color 0.3s, color 0.3s;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: background-color 0.3s;
    }

    h1 { border-bottom: 2px solid var(--text); padding-bottom: 10px; }
    .info { color: var(--text); opacity: 0.7; }
  </style>
</head>
<body>
  <h1>方案1：CSS变量 + 媒体查询</h1>
  <div class="card">
    <p><strong>原理：</strong>使用 <code>@media (prefers-color-scheme: dark)</code> 检测系统暗色模式偏好，自动切换 CSS 变量值。</p>
  </div>
  <div class="card">
    <p><strong>特点：</strong></p>
    <ul>
      <li>全自动跟随操作系统设置</li>
      <li>无需 JavaScript 代码</li>
      <li>用户无法手动覆盖</li>
      <li>适合"默认跟随系统"的场景</li>
    </ul>
  </div>
  <div class="card">
    <p class="info">提示：切换系统的暗色模式即可看到效果。</p>
  </div>
</body>
</html>
